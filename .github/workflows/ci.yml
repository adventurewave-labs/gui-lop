name: ci

# Backend test gate. Required for merge.
# Runs on every PR plus pushes to main and any claude/** branch so the
# bot's PR previews still get a green check.
on:
  pull_request:
  push:
    branches:
      - main
      - "claude/**"

# Cancel superseded runs on the same branch.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 24 = Active LTS (default runtime, Docker image); 22 = engines floor.
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        # Strict checkJs over every file carrying `// @ts-check` (shared-kernel
        # + bootstrap today; repo-policy test enforces it there). Blocking.
        run: npm run typecheck

      - name: Backend + integration tests
        env:
          NODE_ENV: test
          # Bootstrap falls back to in-memory adapters when these are unset.
          DATABASE_URL: ""
          REDIS_URL: ""
          JWT_SECRET: ci-test-secret-not-used-in-prod
        # Coverage on every leg: the per-area ratchet floors in
        # jest.backend.config.js fail the job if coverage drops (roadmap #15).
        run: npm run test:coverage:backend

      - name: Upload coverage report
        if: always() && matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Frontend service tests (WebSocket client)
        run: npm run test:frontend-services

  bare-env:
    # Backend suite in a bare node:24-slim container: Debian GNU userland,
    # no libpcap, no runner-image conveniences, root umask differs from the
    # standard image. The suite is in-memory (no services), so it must pass
    # with zero environment help. Purpose: catch umask- and system-library-
    # dependent regressions that only show up off the runner image.
    # Blocking gate alongside backend-tests.
    name: backend tests (bare node:24-slim)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:24-slim
    steps:
      - name: Install git + ca-certificates (slim ships without either; checkout
              needs git, and git's HTTPS fetch fails cert verification without
              a CA bundle — first CI run failed exactly there)
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Backend suite (umask 0002, empty service URLs)
        run: |
          bash -c 'umask 0002; echo "umask: $(umask)"; cd $GITHUB_WORKSPACE && NODE_ENV=test DATABASE_URL= REDIS_URL= JWT_SECRET=bare-env-ci-secret npx jest --config jest.backend.config.js --silent'
